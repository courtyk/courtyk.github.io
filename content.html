<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Battle</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: white;
      text-align: center;
      background: linear-gradient(180deg, #050014, #16104a, #050014);
      overflow-x: hidden;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 3.5rem;
      color: #9ad7ff;
      text-shadow: 0 0 15px #7ec8ff, 0 0 30px #ff8ae2;
    }

    p {
      max-width: 700px;
      margin: 15px auto;
      font-size: 1.2rem;
    }

    img {
      width: 85%;
      max-width: 850px;
      border-radius: 20px;
      border: 4px solid #9ad7ff;
      box-shadow: 0 0 30px #7ec8ff;
      animation: glowPulse 3s infinite alternate;
    }

    /* Extra aesthetic effect for the battle image */
    @keyframes glowPulse {
      from {
        box-shadow: 0 0 20px #7ec8ff;
      }
      to {
        box-shadow: 0 0 45px #ff8ae2;
      }
    }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      border-radius: 30px;
      background: linear-gradient(135deg, #7ec8ff, #ff8ae2);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 15px #ff8ae2;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    a:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px white;
    }

    .battle-card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 20px;
      max-width: 950px;
      margin: 20px auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Boss Battle Challenge</h1>

    <p>
      The hero can only strike the monster after answering the English question
      correctly. This combines RPG action with educational gameplay.
    </p>

    <div class="battle-card">
      <img src="battle-question.png" alt="RPG boss battle with English question" />
    </div>

    <br />

    <a href="index.html">Return to Home</a>
  </div>
</body>
</html>

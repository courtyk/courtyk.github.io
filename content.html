<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Battle</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: white;
      text-align: center;
      background: linear-gradient(180deg, #030014, #0b0f3d, #050014);
      overflow-x: hidden;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 3.5rem;
      color: #9ad7ff;
      text-shadow: 0 0 15px #7ec8ff, 0 0 35px #8f5cff;
      margin-bottom: 10px;
    }

    p {
      max-width: 750px;
      margin: 15px auto 30px;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .battle-card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(126, 200, 255, 0.5);
      border-radius: 24px;
      padding: 18px;
      max-width: 1000px;
      margin: 20px auto;
      box-shadow: 0 0 30px rgba(126, 200, 255, 0.5);
    }

    img {
      width: 100%;
      border-radius: 18px;
      display: block;
      animation: glowPulse 3s infinite alternate;
    }

    @keyframes glowPulse {
      from {
        box-shadow: 0 0 20px #7ec8ff;
      }
      to {
        box-shadow: 0 0 45px #8f5cff;
      }
    }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      border-radius: 30px;
      background: linear-gradient(135deg, #7ec8ff, #8f5cff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 15px #7ec8ff;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    a:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px white;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Night Boss Battle</h1>

    <p>
      The hero charges into battle under the moonlight, using a glowing sword to face
      a powerful shadow monster.
    </p>

    <div class="battle-card">
      <img src="epic_battle_beneath_the_stormy_moon.png" alt="Blonde sword hero fighting a black monster at night" />
    </div>

    <a href="index.html">Return to Home</a>
  </div>
</body>
</html>

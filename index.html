<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest Arena</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: white;
      text-align: center;
      background: radial-gradient(circle at top, #243b7a, #090018 70%);
      overflow-x: hidden;
    }

    /* IMPROVEMENT 1: animated glowing background */
    body::before {
      content: "";
      position: fixed;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#9ad7ff 1px, transparent 1px);
      background-size: 80px 80px, 130px 130px;
      animation: starsMove 25s linear infinite;
      opacity: 0.35;
      z-index: -1;
    }

    @keyframes starsMove {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(120px);
      }
    }

    .container {
      padding: 50px 20px;
    }

    h1 {
      font-size: 4rem;
      color: #ffd6ff;
      text-shadow: 0 0 15px #ff7df2, 0 0 30px #7ec8ff;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: 10px auto 25px;
    }

    video {
      width: 80%;
      max-width: 800px;
      border: 4px solid #ffd6ff;
      border-radius: 20px;
      box-shadow: 0 0 25px #ff7df2;
      margin: 20px 0;
    }

    button, a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff8ae2, #7ec8ff);
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 15px #ff8ae2;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover, a:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px #ffffff;
    }

    /* IMPROVEMENT 2: quiz pop-up */
    .quiz-box {
      display: none;
      background: rgba(10, 5, 30, 0.95);
      border: 3px solid #7ec8ff;
      box-shadow: 0 0 25px #7ec8ff;
      border-radius: 20px;
      padding: 25px;
      max-width: 500px;
      margin: 30px auto;
    }

    .answer {
      display: block;
      margin: 12px auto;
      width: 80%;
      padding: 12px;
      border-radius: 15px;
      background-color: #25104a;
      color: white;
      border: 2px solid #ff8ae2;
      cursor: pointer;
    }

    .answer:hover {
      background-color: #ff8ae2;
    }

    #feedback {
      font-weight: bold;
      margin-top: 15px;
      color: #ffd6ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Quest Arena</h1>

    <p>
      Enter a fantasy RPG world where heroes must use both power and knowledge
      to defeat magical monsters.
    </p>

    <video autoplay loop muted controls>
      <source src="video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <br />

    <button onclick="showQuiz()">Unlock Boss Battle</button>

    <div class="quiz-box" id="quizBox">
      <h2>Answer to Enter the Battle!</h2>
      <p>Which sentence is grammatically correct?</p>

      <button class="answer" onclick="wrongAnswer()">A. She go to school.</button>
      <button class="answer" onclick="correctAnswer()">B. She goes to school.</button>
      <button class="answer" onclick="wrongAnswer()">C. She going to school.</button>

      <p id="feedback"></p>
    </div>
  </div>

  <script>
    function showQuiz() {
      document.getElementById("quizBox").style.display = "block";
    }

    function correctAnswer() {
      document.getElementById("feedback").innerHTML =
        "Correct! The battle portal is opening...";
      
      setTimeout(function() {
        window.location.href = "content.html";
      }, 1200);
    }

    function wrongAnswer() {
      document.getElementById("feedback").innerHTML =
        "Try again! You must answer correctly to attack the boss.";
    }
  </script>
</body>
</html>
</body>
</html>
